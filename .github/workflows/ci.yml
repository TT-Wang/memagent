name: CI

on:
  push:
    branches: ['**']   # every branch (pre-1.0): CI runs on each push, not just main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        # windows-latest is PARKED, not deleted. The native-Windows cell was red on ~7 real
        # portability failures (POSIX signal sweep, child-process liveness, rg multiline, scope
        # measurement, cmd argument quoting) and we are not maintaining that platform right now.
        # The platform_compat seam in src/ is untouched, so restoring coverage is re-adding the
        # include block below — nothing else. Until then Windows regressions are NOT caught.
        #   include:
        #     - os: windows-latest
        #       python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ripgrep (powers grep / glob / the code-index tier)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y
          else
            brew install ripgrep
          fi

      - name: Install sliceagent + dev/tui extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui]"

      - name: Smoke — the installed console script runs AND reports the product version
        run: |
          OUT=$(sliceagent version)
          echo "$OUT"
          echo "$OUT" | grep -qE "0\.[0-9]+\.[0-9]+" || { echo "smoke: no version in output"; exit 1; }
          echo "$OUT" | grep -q "0.1.0" && { echo "smoke: reports member version, not the product"; exit 1; } || true

      - name: Lint (ruff)
        run: ruff check packages src tests

      - name: Tests
        run: bash scripts/run_tests.sh
        env:
          # Scheduler pins race a real clock. Calibrated on an idle laptop their budgets get as
          # tight as 10ms, and a shared runner's scheduling jitter routinely exceeds that — a live
          # child misses its touch window, looks inactive, and the pin goes red for a reason
          # unrelated to the invariant. This stretches every budget by the same factor so the
          # RATIOS each pin asserts are preserved. Measured on a 3x-oversubscribed box: scale 1
          # failed 1 run in 3, scale 4 passed 3 in 3. Costs ~30s on this file.
          SLICE_TEST_TIME_SCALE: "4"

      # The collaboration-core conformance probes are an executable contract, not pytest-collected
      # (evals/ is intentionally outside tests/). Exit-code gated like the suite: a silent regression
      # in the peer-collaboration interface fails the build.
      - name: Conformance — collaboration core
        run: python evals/collaboration_core_conformance.py

      # Pi-style supply-chain gate: every DIRECT dependency must be exact-pinned; a version range
      # in pyproject.toml is a reviewed-code-change violation, not ambient resolution.
      - name: Supply chain — pinned direct deps
        run: python scripts/check_pinned_deps.py

      # Users install via `uv tool install` (install.sh / install.ps1) — a DIFFERENT code path from
      # the pip install above (uv writes .exe trampoline shims on Windows; antivirus/permission
      # surface). Validate it from the built wheel on the Windows cell.
      # INERT while the windows-latest cell is parked (see the matrix above) — the guard below keeps
      # it from running anywhere else, and it comes back on its own when that cell is restored.
      - name: Windows — validate the uv tool-install path
        if: runner.os == 'Windows'
        run: |
          pip install uv build
          python -m build --wheel
          uv tool install --python 3.12 --from "$(ls dist/*.whl)" sliceagent
          "$USERPROFILE/.local/bin/sliceagent.exe" version
